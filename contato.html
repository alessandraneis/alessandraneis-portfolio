    <header class="form">
    <form>
        <h3> Gostaria de entrar em contato? </h3>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
        <br><br>
        <label for="e-mail">E-mail:</label>
        <input type="text" id="email" name="email">
        <br><br>
        <label for="mensagem">Escreva aqui sua mensagem: </label>
        <br><br>
        <textarea type="text" id="mensagem" name="mensagem" style="width:230px; height: 80px;"></textarea>
        <br><br>
        <button type="button" onclick="enviarDados()">Enviar</button>
    </form>
    </header>
   
    <script> 
    function enviarDados() {
    // Captura o valor do campo email
    const email = document.getElementById('email').value;
    
    // Regex para validar o formato do email
    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    // Testa se o email corresponde ao padrão
    if (regexEmail.test(email)) {
        alert("Mensagem enviada com sucesso!");
    } else {
        alert("Por favor, insira um email válido!");
    }
}
    </script>
